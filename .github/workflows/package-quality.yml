name: Package Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        run: |
          set -euo pipefail

          version="0.12.5"
          archive="uv-x86_64-unknown-linux-gnu.tar.gz"
          expected_sha256="68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"

          curl -fsSL             "https://github.com/astral-sh/uv/releases/download/${version}/${archive}"             -o "/tmp/${archive}"

          printf '%s  %s\n'             "$expected_sha256"             "/tmp/${archive}"             | sha256sum --check --strict

          tar -xzf "/tmp/${archive}" -C /tmp

          sudo install -m 0755             "/tmp/uv-x86_64-unknown-linux-gnu/uv"             /usr/local/bin/uv

          uv --version

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Sync locked development environment
        run: |
          uv sync             --frozen             --extra dev             --python "${{ matrix.python-version }}"

      - name: Run unit tests
        if: matrix.python-version != '3.14'
        run: |
          uv run             --frozen             --python "${{ matrix.python-version }}"             pytest -q

      - name: Run unit tests with coverage
        if: matrix.python-version == '3.14'
        run: |
          uv run             --frozen             --python "${{ matrix.python-version }}"             pytest -q             --cov=rom_metadata_framework             --cov-branch             --cov-report=term-missing:skip-covered

      - name: Run Ruff
        run: |
          uv run             --frozen             --python "${{ matrix.python-version }}"             ruff check src tests

  package-artifact:
    name: Build and install artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        run: |
          set -euo pipefail

          version="0.12.5"
          archive="uv-x86_64-unknown-linux-gnu.tar.gz"
          expected_sha256="68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"

          curl -fsSL             "https://github.com/astral-sh/uv/releases/download/${version}/${archive}"             -o "/tmp/${archive}"

          printf '%s  %s\n'             "$expected_sha256"             "/tmp/${archive}"             | sha256sum --check --strict

          tar -xzf "/tmp/${archive}" -C /tmp

          sudo install -m 0755             "/tmp/uv-x86_64-unknown-linux-gnu/uv"             /usr/local/bin/uv

          uv --version

      - name: Build distribution artifacts
        run: uv build

      - name: Validate built artifacts
        run: ./scripts/check-package-artifacts
