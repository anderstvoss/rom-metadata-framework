[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-metadata-framework"
version = "0.1.0"
description = "Framework for ROM identification and metadata resolution"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Anders Voss" }
]
keywords = [
  "emulation",
  "game-metadata",
  "rom",
  "rom-identification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[project.urls]
Documentation = "https://github.com/anderstvoss/rom-metadata-framework/tree/main/docs"
Issues = "https://github.com/anderstvoss/rom-metadata-framework/issues"
Repository = "https://github.com/anderstvoss/rom-metadata-framework"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
